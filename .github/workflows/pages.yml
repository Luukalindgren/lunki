name: Julkaisu

# Asiakas GitHub Pagesiin aina, kun main päivittyy.
# Palvelimen osoite tulee repositorion muuttujasta LUNKI_SERVER_URL
# (Settings → Secrets and variables → Actions → Variables), esim.
# wss://pelikone.tailnet-nimi.ts.net. Ks. docs/julkaisu.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @lunki/client build
        env:
          VITE_LUNKI_SERVER: ${{ vars.LUNKI_SERVER_URL }}
          VITE_COMMIT: ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Muotoilu
        run: pnpm format:check
      - name: Tyypitys
        run: pnpm typecheck
      - name: Testit
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    # Pelipalvelimen kontti pysyy rakennettavana (ks. docs/julkaisu.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kontti
        run: docker build -t lunki-server .
